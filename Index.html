<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Anime - Watch Trailers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; line-height: 1.6; }
        header { padding: 20px 5%; background-color: #111; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: bold; color: #e50914; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; }
        .hero { height: 60vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://wallpapercave.com/wp/wp2583808.jpg') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 50px; margin-bottom: 10px; }
        .container { padding: 40px 5%; }
        .section-title { font-size: 30px; margin-bottom: 30px; border-left: 5px solid #e50914; padding-left: 15px; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .anime-card { background-color: #111; border-radius: 10px; overflow: hidden; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .anime-info { padding: 20px; }
        .watch-btn { display: inline-block; padding: 10px 20px; background-color: #e50914; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">AR Anime</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Series</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Welcome to AR Anime</h1>
        <p>Stream the latest official trailers.</p>
    </div>

    <div class="container">
        <h2 class="section-title">Latest Trailers</h2>
        <div class="anime-grid">
            <div class="anime-card">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/d6z_oyUWoA8" allowfullscreen></iframe>
                </div>
                <div class="anime-info">
                    <h3>Demon Slayer</h3>
                    <p>Official Trailer.</p>
                    <a href="https://www.crunchyroll.com/" target="_blank" class="watch-btn">Watch on Crunchyroll</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
